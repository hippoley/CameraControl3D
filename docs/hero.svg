<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">CameraControl3D</title>
  <desc id="desc">Draw intent. Get cinematic camera motion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a10"/>
      <stop offset="0.52" stop-color="#17111f"/>
      <stop offset="1" stop-color="#09090d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.40" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#8b5cf6" stop-opacity=".10"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".52" stop-color="#d8b4fe"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="700" rx="42" fill="url(#bg)"/>
  <rect width="1600" height="700" rx="42" fill="url(#glow)"/>

  <g opacity=".14" stroke="#fff">
    <path d="M0 565 H1600"/>
    <path d="M0 470 H1600"/>
    <path d="M0 375 H1600"/>
    <path d="M0 280 H1600"/>
    <path d="M0 185 H1600"/>
    <path d="M980 0 V700"/>
    <path d="M1120 0 V700"/>
    <path d="M1260 0 V700"/>
    <path d="M1400 0 V700"/>
  </g>

  <g transform="translate(92 90)">
    <rect x="0" y="0" width="860" height="520" rx="30" fill="#121017" stroke="#2d2534" stroke-width="2" filter="url(#shadow)"/>
    <rect x="28" y="28" width="804" height="464" rx="22" fill="#19151d"/>

    <g opacity=".55">
      <rect x="64" y="100" width="250" height="180" rx="18" fill="#4f4554"/>
      <rect x="96" y="128" width="186" height="54" rx="14" fill="#75687a"/>
      <rect x="510" y="82" width="214" height="122" rx="10" fill="#2e313b"/>
      <rect x="520" y="92" width="194" height="102" rx="8" fill="#11131a"/>
      <rect x="382" y="310" width="222" height="72" rx="18" fill="#604633"/>
      <ellipse cx="458" cy="430" rx="245" ry="26" fill="#6b555c" opacity=".55"/>
    </g>

    <path d="M105 390 C210 250 330 430 430 300 C520 182 660 180 750 112"
          fill="none" stroke="#a78bfa" stroke-opacity=".14" stroke-width="34" filter="url(#soft)"/>
    <path d="M105 390 C210 250 330 430 430 300 C520 182 660 180 750 112"
          fill="none" stroke="url(#path)" stroke-width="10" stroke-linecap="round"/>

    <g fill="#fff">
      <circle cx="105" cy="390" r="10"/>
      <circle cx="430" cy="300" r="8" opacity=".9"/>
      <circle cx="750" cy="112" r="10"/>
    </g>

    <g transform="translate(650 92)">
      <rect x="0" y="0" width="132" height="84" rx="12" fill="none" stroke="#fff" stroke-width="4"/>
      <rect x="-10" y="16" width="18" height="52" rx="5" fill="#fff"/>
      <circle cx="66" cy="42" r="18" fill="none" stroke="#fff" stroke-width="4"/>
    </g>

    <g transform="translate(72 42)">
      <rect width="176" height="34" rx="17" fill="#211b27" stroke="#3b3144"/>
      <circle cx="18" cy="17" r="5" fill="#f59e0b"/>
      <text x="32" y="22" fill="#d9d2df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">DRAW INTENT</text>
    </g>

    <g transform="translate(572 418)">
      <rect width="218" height="42" rx="21" fill="#ffffff"/>
      <text x="109" y="27" text-anchor="middle" fill="#17111f" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">5TH-ORDER FLOW</text>
    </g>
  </g>

  <g transform="translate(1010 144)">
    <text x="0" y="0" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800">CameraControl3D</text>
    <text x="0" y="72" fill="#d8b4fe" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Draw the move.</text>
    <text x="0" y="114" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Point at the subject.</text>
    <text x="0" y="156" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Get a cinematic shot.</text>

    <text x="0" y="226" fill="#b8afbd" font-family="Inter, Arial, sans-serif" font-size="21">
      Stop animating cameras one keyframe at a time.
    </text>
    <text x="0" y="260" fill="#b8afbd" font-family="Inter, Arial, sans-serif" font-size="21">
      Author intent. Let the camera compiler do the rest.
    </text>

    <g transform="translate(0 318)">
      <rect x="0" y="0" width="176" height="44" rx="22" fill="#8b5cf6"/>
      <text x="88" y="28" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">THREE.JS</text>
      <rect x="190" y="0" width="236" height="44" rx="22" fill="#201a26" stroke="#3b3144"/>
      <text x="308" y="28" text-anchor="middle" fill="#eee7f2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">INTENT → MOTION</text>
    </g>
  </g>
</svg>